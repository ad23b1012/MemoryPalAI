version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memorypal_app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - POSTGRES_USER=${POSTGRES_USER:-memorypal_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-memorypal_pass}
      - POSTGRES_DB=${POSTGRES_DB:-memorypal}
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-memorypalai}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-memorypal}
    depends_on:
      - postgres_db
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  postgres_db:
    image: postgres:16-alpine
    container_name: memorypal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memorypal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorypal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-memorypal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memorypal_user} -d ${POSTGRES_DB:-memorypal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  chroma_data:

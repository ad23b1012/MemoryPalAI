version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memorypal_app
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - POSTGRES_USER=${POSTGRES_USER:-memorypal_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-memorypal_pass}
      - POSTGRES_DB=${POSTGRES_DB:-memorypal}
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-memorypalai}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-memorypal}
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres_db:
    image: postgres:16-alpine
    container_name: memorypal_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memorypal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorypal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-memorypal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memorypal_user} -d ${POSTGRES_DB:-memorypal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: memorypal_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  postgres_data:
  chroma_data:
